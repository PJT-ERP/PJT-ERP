name: Frontend CI

on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - 'src/app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Build & Test Frontend
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test -- --run

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
