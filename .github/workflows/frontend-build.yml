name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  workflow_dispatch:

jobs:
  frontend-build:
    name: Build frontend
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
