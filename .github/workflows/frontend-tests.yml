name: Frontend Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  workflow_dispatch:

jobs:
  frontend-test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test -- --run
