x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  JWT_KEY: "dev-only-change-this-key-before-production-please"
  DEV_MASTER_TOKEN: "dev-master-token"
  Jwt__Issuer: "PJT-ERP.Identity"
  Jwt__Audience: "PJT-ERP.Web"
  OpenApi__PublicServerUrl: "http://localhost:5000"
  ConnectionStrings__IdentityConnection: "Host=db;Port=5432;Database=pjt_identity;Username=postgres;Password=postgres"
  ConnectionStrings__MasterDataConnection: "Host=db;Port=5432;Database=pjt_masterdata;Username=postgres;Password=postgres"
  ConnectionStrings__ProductionConnection: "Host=db;Port=5432;Database=pjt_production;Username=postgres;Password=postgres"
  ConnectionStrings__QcConnection: "Host=db;Port=5432;Database=pjt_qc;Username=postgres;Password=postgres"
  ConnectionStrings__PurchasingConnection: "Host=db;Port=5432;Database=pjt_purchasing;Username=postgres;Password=postgres"
  ConnectionStrings__FinanceConnection: "Host=db;Port=5432;Database=pjt_finance;Username=postgres;Password=postgres"
  ConnectionStrings__NpgmqConnection: "Host=db;Port=5432;Database=pjt_eventbus;Username=postgres;Password=postgres"
  ConnectionStrings__CacheConnection: "Host=db;Port=5432;Database=pjt_cache;Username=postgres;Password=postgres"
  Seq__ServerUrl: "http://seq:80"
  DOTNET_gcServer: "0"

services:
  seq:
    image: datalust/seq:2026.1.17114
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true

  db:
    image: ghcr.io/pgmq/pg17-pgmq:v1.8.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pjt_db:/var/lib/postgresql/data
      - ./.database/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PROJECT_PATH: "src/Services/Identity.API/Identity.API.csproj"
        ENTRY_DLL: "Identity.API.dll"
    environment: *api-environment
    ports:
      - "127.0.0.1:5001:8080"
    depends_on:
      db:
        condition: service_healthy

  masterdata-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PROJECT_PATH: "src/Services/MasterData.API/MasterData.API.csproj"
        ENTRY_DLL: "MasterData.API.dll"
    environment: *api-environment
    ports:
      - "127.0.0.1:5002:8080"
    depends_on:
      db:
        condition: service_healthy

  production-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PROJECT_PATH: "src/Services/Production.API/Production.API.csproj"
        ENTRY_DLL: "Production.API.dll"
    environment: *api-environment
    ports:
      - "127.0.0.1:5003:8080"
    volumes:
      - pjt_engineering_drawings:/app/wwwroot/engineering-drawings
    depends_on:
      db:
        condition: service_healthy

  qc-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PROJECT_PATH: "src/Services/QC.API/QC.API.csproj"
        ENTRY_DLL: "QC.API.dll"
    environment: *api-environment
    ports:
      - "127.0.0.1:5004:8080"
    volumes:
      - pjt_qc_photos:/app/wwwroot/qc-photos
    depends_on:
      db:
        condition: service_healthy

  purchasing-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PROJECT_PATH: "src/Services/Purchasing.API/Purchasing.API.csproj"
        ENTRY_DLL: "Purchasing.API.dll"
    environment: *api-environment
    ports:
      - "127.0.0.1:5005:8080"
    depends_on:
      db:
        condition: service_healthy

  finance-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PROJECT_PATH: "src/Services/Finance.API/Finance.API.csproj"
        ENTRY_DLL: "Finance.API.dll"
    environment: *api-environment
    ports:
      - "127.0.0.1:5006:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pjt_finance_proofs:/app/wwwroot/proofs

  web-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PROJECT_PATH: "src/ApiGateways/Web.Gateway/Web.Gateway.csproj"
        ENTRY_DLL: "Web.Gateway.dll"
    environment:
      <<: *api-environment
      ReverseProxy__Clusters__identity__Destinations__identityApi__Address: "http://identity-api:8080/"
      ReverseProxy__Clusters__masterdata__Destinations__masterdataApi__Address: "http://masterdata-api:8080/"
      ReverseProxy__Clusters__production__Destinations__productionApi__Address: "http://production-api:8080/"
      ReverseProxy__Clusters__qc__Destinations__qcApi__Address: "http://qc-api:8080/"
      ReverseProxy__Clusters__purchasing__Destinations__purchasingApi__Address: "http://purchasing-api:8080/"
      ReverseProxy__Clusters__finance__Destinations__financeApi__Address: "http://finance-api:8080/"
    ports:
      - "5000:8080"
    depends_on:
      identity-api:
        condition: service_started
      masterdata-api:
        condition: service_started
      production-api:
        condition: service_started
      qc-api:
        condition: service_started
      purchasing-api:
        condition: service_started
      finance-api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:5000}"
        VITE_DEV_MASTER_TOKEN: "${VITE_DEV_MASTER_TOKEN:-dev-master-token}"
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      web-gateway:
        condition: service_started

volumes:
  pjt_db:
  pjt_finance_proofs:
  pjt_qc_photos:
  pjt_engineering_drawings:
